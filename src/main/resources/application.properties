# ===================================================================
# RIKKEI CRM TICKET ASSISTANT - BÀI 2: CHUNKING STRATEGIES
# ===================================================================

# 1. Tên ứng dụng
spring.application.name=crm-chunking-strategies

# 2. Cấu hình Chiến lược Chunking cho Tài liệu Loại A (Quy trình hoàn tiền - Step-oriented)
crm.chunking.step-oriented.chunk-size=400
crm.chunking.step-oriented.min-chunk-size-chars=120
crm.chunking.step-oriented.min-chunk-length-to-embed=5
crm.chunking.step-oriented.max-num-chunks=10000
crm.chunking.step-oriented.keep-separator=true
crm.chunking.step-oriented.overlap-chars=80

# 3. Cấu hình Chiến lược Chunking cho Tài liệu Loại B (Quy chế khách hàng - Header-based)
crm.chunking.hierarchical.max-tokens=800
crm.chunking.hierarchical.min-section-chars=100
crm.chunking.hierarchical.preserve-parent-header=true

# 4. Cấu hình Logging
logging.level.root=INFO
logging.level.com.rikkei.crm=DEBUG
logging.level.org.springframework.ai=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
